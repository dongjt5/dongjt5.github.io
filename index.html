<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dylan Studio — 独立产品</title>
<style>
  :root{
    --bg:#F7F9FC;
    --surface:#FFFFFF;
    --text:#15213B;
    --muted:#66728A;
    --line:#E4EAF3;
    --primary:#3978FF;
    --primary2:#6C5CFF;
    --soft:#EEF4FF;
    --shadow:0 18px 50px rgba(36,66,120,.10);
    --shadow-sm:0 8px 24px rgba(36,66,120,.06);
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(700px 420px at 80% -10%, rgba(57,120,255,.12), transparent 60%),
      radial-gradient(520px 360px at 0% 30%, rgba(108,92,255,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    line-height:1.6;
    min-height:100vh;
  }
  a{text-decoration:none;color:inherit}
  .container{width:min(1120px,calc(100% - 40px));margin:0 auto}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(228,234,243,.9);
  }
  nav{height:70px;display:flex;align-items:center;justify-content:space-between}
  
  .logo{font-weight:800;letter-spacing:.08em;font-size:18px;display:flex;align-items:center;gap:10px}
  .logo-mark{
    width:32px;height:32px;
    border-radius:8px;
    object-fit:cover;
    box-shadow: 0 4px 12px rgba(57,120,255,.15);
  }

  .nav-links{display:flex;gap:28px;font-size:14px;color:#56627A}
  .nav-links a:hover{color:var(--primary)}

  /* ---------- Carousel ---------- */
  .carousel-section{padding:40px 0 10px}
  .carousel{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .carousel::before{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(520px 260px at 88% 10%, rgba(57,120,255,.10), transparent 65%),
      radial-gradient(420px 240px at 6% 90%, rgba(108,92,255,.08), transparent 65%);
    pointer-events:none;
  }
  .viewport{overflow:hidden;position:relative}
  .track{
    display:flex;
    transition:transform .55s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }
  .slide{
    flex:0 0 100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:36px;
    align-items:center;
    padding:52px 56px;
  }
  .slide-text .eyebrow{
    font-size:12px;font-weight:800;letter-spacing:.18em;
    text-transform:uppercase;color:var(--primary);margin-bottom:12px;
  }
  .slide-text h2{
    font-size:clamp(26px,3.4vw,38px);
    letter-spacing:-.03em;line-height:1.15;margin-bottom:12px;
  }
  .slide-text p{color:var(--muted);font-size:15px;margin-bottom:24px;max-width:440px}
  .slide-actions{display:flex;gap:12px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 24px;border-radius:12px;font-size:14px;font-weight:650;
    transition:.2s;cursor:pointer;border:1px solid transparent;
  }
  .btn-primary{
    color:#fff;
    background:linear-gradient(100deg,var(--primary),var(--primary2));
    box-shadow:0 12px 28px rgba(74,102,235,.24);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(74,102,235,.32)}
  .btn-ghost{color:var(--text);border-color:var(--line);background:#fff}
  .btn-ghost:hover{border-color:#C9D8F0}

  .slide-visual{display:flex;justify-content:center; width: 100%;}
  
  .visual-card{
    width:100%;
    aspect-ratio:4/5;
    border-radius:26px;
    background: #F4F8FF;
    box-shadow:0 24px 60px rgba(45,71,115,.16);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    border: none;
  }
  .visual-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* arrows */
  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    color:#41506B;font-size:18px;
    display:grid;place-items:center;cursor:pointer;
    transition:.2s;z-index:5;
    box-shadow:0 6px 18px rgba(45,71,115,.10);
  }
  .arrow:hover{background:#fff;border-color:#C9D8F0;color:var(--primary)}
  .arrow.prev{left:18px}
  .arrow.next{right:18px}

  /* dots */
  .dots{
    display:flex;justify-content:center;gap:8px;
    padding:0 0 26px;position:relative;z-index:5;
  }
  .dot{
    width:8px;height:8px;border-radius:999px;
    background:#CBD7EA;border:none;cursor:pointer;padding:0;
    transition:.25s;
  }
  .dot.active{width:26px;background:linear-gradient(90deg,var(--primary),var(--primary2))}

  /* ---------- Products ---------- */
  .section{padding:56px 0}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}
  .section-head h2{font-size:30px;letter-spacing:-.02em}
  .section-head p{color:var(--muted);font-size:14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .card{
    display:flex;flex-direction:column;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    box-shadow:var(--shadow-sm);
    transition:.22s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#C9D8F0}
  
  /* 图标容器样式 */
  .icon{
    width:52px;height:52px;border-radius:14px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(57,120,255,.14),rgba(108,92,255,.10));
    border:1px solid #DCE7F8;
    color:var(--primary);font-size:22px;margin-bottom:18px;
  }
  /* 当容器内有图片时，去掉背景和边框，让图片铺满 */
  .icon.has-image {
    background: transparent;
    border: none;
    overflow: hidden;
  }
  .icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }

  .card h3{font-size:18px;margin-bottom:6px}
  .card p{color:var(--muted);font-size:14px;flex:1}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .tag{
    font-size:11px;letter-spacing:.04em;color:#5B6B86;
    border:1px solid var(--line);border-radius:999px;
    padding:4px 10px;background:#F8FAFF;
  }
  .card .more{margin-top:18px;font-size:13px;font-weight:700;color:var(--primary)}

  /* ---------- 收尾区块：企业宣言 + 关于 ---------- */
  .closing{padding:56px 0 10px}
  .manifesto{
    text-align:center;
    max-width:820px;
    margin:0 auto 40px;
  }
  .manifesto h2{
    font-size:clamp(32px,4.6vw,52px);
    line-height:1.12;
    letter-spacing:-.04em;
    font-weight:800;
    margin-bottom:18px;
  }
  .manifesto h2 em{
    font-style:normal;
    background:linear-gradient(100deg,var(--primary),var(--primary2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .manifesto p{
    color:var(--muted);
    font-size:17px;
    max-width:560px;
    margin:0 auto;
  }

  .about{
    border:1px solid var(--line);border-radius:26px;
    padding:36px;background:#fff;box-shadow:var(--shadow-sm);
    display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;
  }
  .about h2{font-size:26px;margin-bottom:10px}
  .about p{color:var(--muted);font-size:14px}
  .about-points{display:grid;gap:12px}
  .point{display:flex;gap:10px;align-items:center;font-size:14px;color:#4C5A75}
  .point b{color:#16A34A}

  footer{padding:36px 0 46px;border-top:1px solid var(--line);margin-top:36px;background:#fff}
  .footer-row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .footer-links a{margin-left:18px}
  .footer-links a:hover{color:var(--primary)}

  @media(max-width:860px){
    .slide{grid-template-columns:1fr;padding:40px 28px;gap:26px;text-align:center}
    .slide-text p{margin-left:auto;margin-right:auto}
    .slide-actions{justify-content:center}
    .slide-visual{order:-1}
    .visual-card{width:100%; max-width: 360px;}
    .arrow{display:none}
    .about{grid-template-columns:1fr}
  }
  @media(max-width:700px){
    .nav-links{display:none}
    .carousel-section{padding:28px 0 6px}
    .section{padding:42px 0}
    .section-head{flex-direction:column;align-items:flex-start}
    .footer-links a{margin:0 14px 0 0}
    .manifesto{margin-bottom:30px}
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="#" class="logo">
        <img src="assets/logo.png" alt="Dylan Studio" class="logo-mark">
        DYLAN STUDIO
      </a>
      <div class="nav-links">
        <a href="#featured">推荐</a>
        <a href="#products">产品</a>
        <a href="#closing">关于</a>
        <a href="/support.html">支持</a>
      </div>
    </nav>
  </div>
</header>

<main>
  <!-- 首屏：推荐产品轮播 -->
  <section class="carousel-section" id="featured">
    <div class="container">
      <div class="carousel" id="carousel">
        <div class="viewport">
          <div class="track" id="track"></div>
        </div>
        <button class="arrow prev" id="prevBtn" aria-label="上一张">‹</button>
        <button class="arrow next" id="nextBtn" aria-label="下一张">›</button>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </section>

  <!-- 全部产品 -->
  <section class="section" id="products">
    <div class="container">
      <div class="section-head">
        <div>
          <h2>全部产品</h2>
          <p>持续更新中，欢迎体验。</p>
        </div>
      </div>
      <div class="grid" id="productGrid"></div>
    </div>
  </section>

  <!-- 收尾：企业宣言 + 关于 -->
  <section class="closing" id="closing">
    <div class="container">
      <div class="manifesto">
        <h2>把复杂的事，<br><em>做得简单一点</em></h2>
        <p>独立开发，持续打磨实用工具。每一款产品都围绕一个具体问题，保持克制、干净和长期可用。</p>
      </div>

      <div class="about">
        <div>
          <h2>关于</h2>
          <p>专注于健康、效率与日常娱乐类产品。产品不追求堆功能，而是尽量把核心体验做顺、做稳。数据能留在本地的，就不上传；能一句说清的，就不绕弯。</p>
        </div>
        <div class="about-points">
          <div class="point"><b>✓</b> 独立开发，持续维护</div>
          <div class="point"><b>✓</b> 重视隐私与数据最小化</div>
          <div class="point"><b>✓</b> iOS 为主，逐步扩展平台</div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-row">
    <div class="logo">
      <img src="assets/logo.png" alt="Dylan Studio" class="logo-mark">
      DYLAN STUDIO
    </div>
    <div class="footer-links">
      <a href="/privacy.html">隐私政策</a>
      <a href="/terms.html">用户协议</a>
      <a href="mailto:lukystar2823@outlook.com">联系</a>
    </div>
  </div>
  <div class="container" style="margin-top: 24px; color: #98a2b2; font-size: 12px;">
    © 2026 Dylan Studio. All rights reserved.
  </div>
</footer>

<script>
  /* ===== 推荐产品（轮播用） ===== */
  const featured = [
    {
      name: "Dylan Health",
      eyebrow: "推荐 · iOS",
      desc: "AI 扫描食物与药品，给出清晰易懂的健康建议。数据尽量留在本地，只做真正有用的分析。",
      primary: { label: "前往 App Store", href: "https://apps.apple.com/hk/app/dylan-health-food-scanner/id6805529950" },
      secondary: { label: "了解更多", href: "#products" },
      image: "assets/health.png", 
      placeholder: "Product Screenshot"
    },
    {
      name: "产品 B",
      eyebrow: "新品 · iOS",
      desc: "一句话说明这款产品解决什么问题，以及它最值得被使用的理由。",
      primary: { label: "查看详情", href: "/products/b.html" },
      secondary: { label: "更多产品", href: "#products" },
      image: "",
      placeholder: "Product Screenshot"
    },
    {
      name: "产品 C",
      eyebrow: "即将上线 · Web",
      desc: "一句话说明这款产品解决什么问题，以及它最值得被使用的理由。",
      primary: { label: "了解进度", href: "#" },
      secondary: { label: "更多产品", href: "#products" },
      image: "",
      placeholder: "Coming Soon"
    }
  ];

  /* ===== 全部产品（网格用） ===== */
  const products = [
    {
      name: "Dylan Health",
      desc: "AI 扫描食物与药品，给出清晰易懂的健康建议。",
      image: "assets/logo.png", // <--- 这里添加了 image 属性
      tags: ["iOS", "订阅制"],
      link: "https://apps.apple.com/hk/app/dylan-health-food-scanner/id6805529950",
      more: "App Store →",
      external: true
    },
    {
      name: "产品 B",
      desc: "一句话说明这款产品解决什么问题。",
      icon: "◈",
      tags: ["iOS", "免费"],
      link: "/products/b.html",
      more: "查看详情 →"
    },
    {
      name: "产品 C",
      desc: "一句话说明这款产品解决什么问题。",
      icon: "▣",
      tags: ["Web", "即将上线"],
      link: "#",
      more: "了解更多 →"
    }
  ];

  /* ===== 渲染轮播 ===== */
  const track = document.getElementById("track");
  const dotsWrap = document.getElementById("dots");

  track.innerHTML = featured.map(item => `
    <div class="slide">
      <div class="slide-text">
        <div class="eyebrow">${item.eyebrow}</div>
        <h2>${item.name}</h2>
        <p>${item.desc}</p>
        <div class="slide-actions">
          <a class="btn btn-primary" href="${item.primary.href}"
             ${item.primary.href.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>
            ${item.primary.label}
          </a>
          <a class="btn btn-ghost" href="${item.secondary.href}">${item.secondary.label}</a>
        </div>
      </div>
      <div class="slide-visual">
        <div class="visual-card">
          ${item.image
            ? `<img src="${item.image}" alt="${item.name}">`
            : item.placeholder}
        </div>
      </div>
    </div>
  `).join("");

  dotsWrap.innerHTML = featured.map((_, i) =>
    `<button class="dot ${i === 0 ? "active" : ""}" data-index="${i}" aria-label="第 ${i + 1} 张"></button>`
  ).join("");

  /* ===== 轮播逻辑 ===== */
  const carousel = document.getElementById("carousel");
  const dots = [...dotsWrap.querySelectorAll(".dot")];
  let index = 0;
  let timer = null;
  const INTERVAL = 5000;

  function goTo(i) {
    index = (i + featured.length) % featured.length;
    track.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((d, k) => d.classList.toggle("active", k === index));
  }

  function next() { goTo(index + 1); }
  function prev() { goTo(index - 1); }

  function startAuto() {
    stopAuto();
    timer = setInterval(next, INTERVAL);
  }
  function stopAuto() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  document.getElementById("nextBtn").addEventListener("click", () => { next(); startAuto(); });
  document.getElementById("prevBtn").addEventListener("click", () => { prev(); startAuto(); });
  dots.forEach(d => d.addEventListener("click", () => {
    goTo(Number(d.dataset.index));
    startAuto();
  }));

  carousel.addEventListener("mouseenter", stopAuto);
  carousel.addEventListener("mouseleave", startAuto);

  let touchX = null;
  carousel.addEventListener("touchstart", e => {
    touchX = e.touches[0].clientX;
    stopAuto();
  }, { passive: true });
  carousel.addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 45) { dx < 0 ? next() : prev(); }
    touchX = null;
    startAuto();
  }, { passive: true });

  document.addEventListener("visibilitychange", () => {
    document.hidden ? stopAuto() : startAuto();
  });

  startAuto();

  /* ===== 渲染产品网格 ===== */
  const grid = document.getElementById("productGrid");
  grid.innerHTML = products.map(p => `
    <a class="card" href="${p.link}" ${p.external ? 'target="_blank" rel="noopener"' : ''}>
      <!-- 这里根据是否配置了 image 动态渲染 -->
      <div class="icon ${p.image ? 'has-image' : ''}">
        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : p.icon}
      </div>
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <div class="more">${p.more}</div>
    </a>
  `).join("");
</script>
</body>
</html>
